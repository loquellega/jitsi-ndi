name: Prueba NDI

# Compila el módulo NDI y publica las 8 señales de prueba en una máquina Windows
# (y en macOS) de GitHub, para confirmar que todo instala y transmite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prueba:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias (descarga el NDI SDK y compila)
        run: npm install
      - name: Publicar y verificar 8 señales NDI
        run: npm run prueba:verificar

  servidor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar configuración de Jitsi (sin Docker)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File servidor\preparar.ps1 -SinDocker
      - name: Revisar el .env generado
        shell: powershell
        run: |
          $e = Get-Content servidor\jitsi\.env
          $e | Select-String -Pattern '^(CONFIG|TZ|HTTPS_PORT|PUBLIC_URL|JVB_ADVERTISE_IPS|RESOLUTION\w*|DISABLE_DEEP_LINKING)='
          $faltan = 'JICOFO_AUTH_PASSWORD','JVB_AUTH_PASSWORD' | Where-Object { -not ($e -match "^$_=[0-9a-f]{32}$") }
          if ($faltan) { throw "Faltan contraseñas: $faltan" }
          if (-not (Test-Path servidor\jitsi\docker-compose.yml)) { throw 'No se descargó docker-compose.yml' }
          'OK'
